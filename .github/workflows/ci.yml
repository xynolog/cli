name: CI

# Every pull request, merge queue entry and push: the checks (generated code,
# vet for each release platform, the build); internal/... on macOS, Linux and
# Windows; and cmd/xynolog's scenarios on Linux, split by test name across
# three runners. The whole suite on all three systems, with coverage, runs
# nightly when main has moved since the last full run, or by dispatch.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes an older one. A
# merge queue entry has a ref of its own, so entries never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (the org's
  # CONTRIBUTING.md).
  dco:
    uses: xynolog/.github/.github/workflows/dco.yml@b3dcbb9f9db37476c2bd259711ebaac6df777fbf

  # On a push to main, the repository's labels become the org's seven.
  labels:
    uses: xynolog/.github/.github/workflows/labels.yml@189966d08e740aa4e79460c9fce7a85769880193
    permissions:
      issues: write

  nightly-due:
    name: Main moved since the last full run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=success&head_sha=$GITHUB_SHA" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')
          if [ "$full_runs" -eq 0 ]; then echo due=true; else echo due=false; fi >> "$GITHUB_OUTPUT"

  # upstream.lock.json names each upstream release by the commit its tag names,
  # and the job yields the SDK bundle as the artifact sdk-artifacts. codegen is
  # the generator check-generated runs.
  sdk:
    name: Upstream lock and SDK bundle
    needs: nightly-due
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-due.outputs.due == 'true') }}
    uses: xynolog/sdk/.github/workflows/upstream.yml@52c59e698b3ee821113f350539f521f6c9df6e1d
    with:
      languages: go codegen
      release: false

  checks:
    name: Checks
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Make help lists every public target
        run: python3 build-tools/test_make_help.py --root .
      - uses: ./.github/actions/sdk-go-proxy
      - name: The generated Go is what the pinned SDK's generator writes
        run: make check-generated SDK_ARTIFACTS="$RUNNER_TEMP/sdk-artifacts"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet for each release platform
        run: |
          for goos in darwin linux windows; do
            echo "GOOS=$goos"
            GOOS=$goos go vet ./...
          done
      - run: go build ./cmd/xynolog

  unit:
    name: Unit tests (${{ matrix.os }})
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -timeout 30m ./internal/...

  scenarios:
    name: Launcher scenarios, shard ${{ matrix.shard }}
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run this shard's share of cmd/xynolog's tests
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        shell: bash
        run: |
          tests=$(go test -list '^Test' ./cmd/xynolog | grep '^Test' | sort)
          mine=$(printf '%s\n' "$tests" | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i' | paste -sd '|' -)
          [ -n "$mine" ] || { echo "cmd/xynolog listed no tests for shard $SHARD of $SHARDS" >&2; exit 1; }
          echo "$(printf '%s\n' "$tests" | wc -l) tests; this shard runs $(printf '%s' "$mine" | tr '|' '\n' | wc -l)"
          go test -timeout 30m -run "^($mine)\$" ./cmd/xynolog

  test:
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    # An explicit budget: the suite drives a fake runtime through real
    # start/stop lifecycles, serially, and runs near Go's undeclared ten-minute
    # default on Linux, past it on macOS, and longest on Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            budget: 30m
          - os: ubuntu-latest
            budget: 30m
          - os: windows-latest
            budget: 50m
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -timeout ${{ matrix.budget }} -coverprofile=coverage.out ./...
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout ${{ matrix.budget }} ./...
      - name: Upload Go coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go-xynolog
          name: go-xynolog
          fail_ci_if_error: false

  # No dependency in any lockfile has a published advisory that advisories.toml
  # does not ignore with a reason, and no ignore outlives its finding
  # (build-tools/advisories.py).
  advisories:
    name: No dependency has an advisory nobody judged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install osv-scanner
        run: |
          bash build-tools/install-osv-scanner.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan every lockfile
        run: python3 build-tools/advisories.py --root .

  # What the ruleset requires. It waits for every other job, a census holds
  # that list to the workflow's jobs, and it fails when any of them failed or
  # was cancelled. A job skipped by its own condition passes.
  gate:
    name: CI Gate
    if: always()
    needs: [dco, labels, nightly-due, sdk, checks, unit, scenarios, test, advisories]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: The gate waits for every other job
        run: |
          jobs="$(yq '.jobs | keys | .[] | select(. != "gate")' .github/workflows/ci.yml | sort)"
          waits="$(yq '.jobs.gate.needs[]' .github/workflows/ci.yml | sort)"
          if [ "$jobs" != "$waits" ]; then
            echo "CI Gate's needs differ from the workflow's jobs (< jobs, > needs):" >&2
            diff <(echo "$jobs") <(echo "$waits") >&2
            exit 1
          fi
      - name: Every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
